default_environment: dev
project_id: forensic-accounting-platform

environments:
  - name: dev

plugins:
  extractors:
    - name: tap-mongodb
      variant: meltano-labs
      namespace: tap_mongodb
      pip_url: git+https://github.com/MeltanoLabs/tap-mongodb.git dnspython
      capabilities:
        - state
        - discover
        - catalog
      config:
        mongodb_connection_string: 'mongodb+srv://shilparg:KZXuOobdYeeoMmwI@cluster0.xw9qkhd.mongodb.net/'
        database: forensic_accounting

  loaders:
    - name: target-bigquery
      variant: adswerve
      namespace: target_bigquery
      pip_url: target-bigquery setuptools
      executable: target-bigquery
      config:
        project_id: forensic-accounting-bot
        dataset_id: raw_sec_landing
        location: asia-southeast1
        keyfile: gcp-service-account.json